apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dfmweb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zxc-dev/dfmweb-gitops.git
    targetRevision: k8s_sit_test
    path: charts/dfmweb
    helm:
      valueFiles:
        - values.yaml
      # 如需覆盖个别参数，在此追加，例如:
      # parameters:
      #   - name: replicaCount
      #     value: "2"
  destination:
    server: https://kubernetes.default.svc
    namespace: dfmweb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
