---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nacos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: dfm
  source:
    repoURL: https://github.com/zxc-dev/dfmweb-gitops.git
    targetRevision: k8s_sit_test
    path: charts/nacos
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    # Nacos pods + headless service live here so Java backends can reach
    # nacos-headless.nacos.svc.cluster.local:8848 just like before.
    namespace: nacos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
