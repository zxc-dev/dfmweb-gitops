apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfmweb.fullname" . }}
  labels:
    {{- include "dfmweb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPortName }}
    protocol: TCP
    name: http
  selector:
    {{- include "dfmweb.selectorLabels" . | nindent 4 }}