# -- 副本数
replicaCount: 2

image:
  # -- 镜像仓库地址 (ECR, 集群有 pull 权限)
  repository: 602499751343.dkr.ecr.eu-west-3.amazonaws.com/dfm/dev/dfmweb
  # -- 镜像 tag(覆盖文件请填具体版本)
  tag: 14-c3a82ee9
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- 启动时注入到 Pod 的环境变量
env:
  # -- 用于 sed 替换 nginx.conf 中 ENV 占位符的版本/构建标识
  TREV: "dev"

# -- 业务后端(Spring Cloud Gateway in-cluster DNS)
backend:
  # -- 业务网关 service.namespace.svc.cluster.local
  host: optgateway.base.svc.cluster.local
  # -- 业务网关端口
  port: 8080
  # -- 反代前缀(/api/ -> http://host:port/dfmadmin/)
  path: /dfmadmin/

serviceAccount:
  # -- 是否创建 ServiceAccount
  create: true
  # -- ServiceAccount annotations
  annotations: {}
  # -- 自定义名称(留空则使用默认生成)
  name: ""

# -- Service 配置: 入口由 ALB Ingress 接管, Service 用 ClusterIP
service:
  # -- ClusterIP(ALB Ingress target-type: ip 直连 Pod, 避免 NLB+ALB 双入口)
  type: ClusterIP
  # -- Service 暴露端口
  port: 80
  # -- 容器端口名(对应 deployment.yaml 中 ports.name)
  targetPortName: http
  # -- ClusterIP 无需 LB 注解
  annotations: {}

# -- Ingress: 通过 AWS Load Balancer Controller 创建 ALB
# 当前走内部组 dfm-internal(内网 HTTP 80); 后续拿到 ACM 证书 ARN 再切 dfm-external(公网 HTTPS)
# 参考样例: ingress-samples/ingress-internal.yaml
ingress:
  # -- 是否创建 Ingress
  enabled: true
  className: alb
  annotations:
    # -- ALB 组名(必填): 同组 Ingress 合并共用一个内部 ALB; 不填会与其它默认组冲突拿不到 ADDRESS
    alb.ingress.kubernetes.io/group.name: dfm-internal
    # -- internal(私有子网) / internet-facing(公有子网)
    alb.ingress.kubernetes.io/scheme: internal
    # -- IP 模式直连 Pod
    alb.ingress.kubernetes.io/target-type: ip
    # -- 监听器: 内部组只开 HTTP 80
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # -- 健康检查路径(与 Deployment 探针一致, 均为 /)
    alb.ingress.kubernetes.io/healthcheck-path: /
  hosts:
    # -- 内部域名: 后缀需与 Route53 私有 zone 一致(dev: dfm-tsp-dev.internal)
    - host: dfmweb.dfm-tsp-dev.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# -- 探针(probe)配置
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 5

# -- HPA(可选)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# -- Pod-level 注解/容忍/拓扑(可选)
podAnnotations: {}
tolerations: []
nodeSelector: {}
affinity: {}

# -- 资源配额/限额
podSecurityContext: {}
securityContext: {}