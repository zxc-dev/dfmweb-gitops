# -- 副本数
replicaCount: 2

image:
  # -- 镜像仓库地址 (ECR, 集群有 pull 权限)
  repository: 602499751343.dkr.ecr.eu-west-3.amazonaws.com/dfm/dev/dfmweb
  # -- 镜像 tag(覆盖文件请填具体版本)
  tag: 14-c3a82ee9
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- 启动时注入到 Pod 的环境变量
env:
  # -- 用于 sed 替换 nginx.conf 中 ENV 占位符的版本/构建标识
  TREV: "dev"

# -- 业务后端(Spring Cloud Gateway in-cluster DNS)
backend:
  # -- 业务网关 service.namespace.svc.cluster.local
  host: optgateway.base.svc.cluster.local
  # -- 业务网关端口
  port: 8080
  # -- 反代前缀(/api/ -> http://host:port/dfmadmin/)
  path: /dfmadmin/

serviceAccount:
  # -- 是否创建 ServiceAccount
  create: true
  # -- ServiceAccount annotations
  annotations: {}
  # -- 自定义名称(留空则使用默认生成)
  name: ""

service:
  type: ClusterIP
  # -- Service 暴露端口
  port: 80
  # -- 容器端口名(对应 deployment.yaml 中 ports.name)
  targetPortName: http

# -- Ingress 配置 (AWS ALB,由 AWS Load Balancer Controller 接管)
ingress:
  # -- 是否创建 Ingress
  enabled: true
  # -- ingressClassName: 由 AWS Load Balancer Controller 提供的 "alb"
  className: alb
  # -- ALB 注解(参考 https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.6/guide/ingress/annotations/)
  annotations:
    # -- 公网入口(internet-facing) / 内网改为 internal
    alb.ingress.kubernetes.io/scheme: internet-facing
    # -- IP 模式直连 Pod;若用 NodePort 则改为 instance
    alb.ingress.kubernetes.io/target-type: ip
    # -- 临时只监听 HTTP 80,等 ACM 证书 ARN 拿到后再切 HTTPS 443
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # -- 健康检查
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200-399"
    # -- 外部 DNS(可选,Route53 自动注册)
    external-dns.alpha.kubernetes.io/hostname: tspweb.dfm-dev.stellantis.cloud
  # -- 路由规则(host 留空可做 ALB 默认 catch-all)
  hosts:
    - host: tspweb.dfm-dev.stellantis.cloud
      paths:
        - path: /
          pathType: Prefix
  # -- ALB 不使用 spec.tls;TLS 由 alb.ingress.kubernetes.io/certificate-arn 注解提供
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# -- 探针(probe)配置
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 5

# -- HPA(可选)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# -- Pod-level 注解/容忍/拓扑(可选)
podAnnotations: {}
tolerations: []
nodeSelector: {}
affinity: {}

# -- 资源配额/限额
podSecurityContext: {}
securityContext: {}