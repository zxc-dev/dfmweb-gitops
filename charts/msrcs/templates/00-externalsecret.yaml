# 从 AWS Secrets Manager 拉取三库凭据，映射为 K8s Secret
# 命名规则：app-db-<mysql|mongodb|redis>
# 文件名以 00- 前缀，确保在 Deployment 前应用（Helm 模板按文件名字母序渲染）
---
# MySQL：dfm/dev/mysql
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-mysql
  namespace: msrcs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-db-mysql          # 生成的 K8s Secret 名称
  data:
    - secretKey: MYSQL_HOST
      remoteRef: { key: dfm/dev/mysql, property: host }
    - secretKey: MYSQL_PORT
      remoteRef: { key: dfm/dev/mysql, property: port }
    - secretKey: MYSQL_DBNAME
      remoteRef: { key: dfm/dev/mysql, property: dbname }
    - secretKey: MYSQL_USERNAME
      remoteRef: { key: dfm/dev/mysql, property: username }
    - secretKey: MYSQL_PASSWORD
      remoteRef: { key: dfm/dev/mysql, property: password }
---
# MongoDB (DocumentDB)：dfm/dev/mongodb（TLS 强制）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-mongodb
  namespace: msrcs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-db-mongodb
  data:
    - secretKey: MONGODB_HOST
      remoteRef: { key: dfm/dev/mongodb, property: host }
    - secretKey: MONGODB_READER_HOST
      remoteRef: { key: dfm/dev/mongodb, property: readerHost }
    - secretKey: MONGODB_PORT
      remoteRef: { key: dfm/dev/mongodb, property: port }
    - secretKey: MONGODB_USERNAME
      remoteRef: { key: dfm/dev/mongodb, property: username }
    - secretKey: MONGODB_PASSWORD
      remoteRef: { key: dfm/dev/mongodb, property: password }
---
# Redis (Valkey)：dfm/dev/redis（强制 TLS + AUTH token）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-redis
  namespace: msrcs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-db-redis
  data:
    - secretKey: REDIS_HOST
      remoteRef: { key: dfm/dev/redis, property: host }
    - secretKey: REDIS_READER_HOST
      remoteRef: { key: dfm/dev/redis, property: readerHost }
    - secretKey: REDIS_PORT
      remoteRef: { key: dfm/dev/redis, property: port }
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef: { key: dfm/dev/redis, property: authToken }
