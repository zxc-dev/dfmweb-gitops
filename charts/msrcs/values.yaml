# -- 副本数
replicaCount: 1

image:
  # -- 镜像仓库地址 (ECR, 集群有 pull 权限)
  repository: 602499751343.dkr.ecr.eu-west-3.amazonaws.com/dfm/dev/msrcs
  # -- 镜像 tag(覆盖文件请填具体版本,ECR 中 latest 可能不存在)
  tag: 1-bcd37ad0
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- 启动时注入到 Pod 的环境变量
env:
  # -- Spring 激活的 profile(原 Marathon 部署为 sit)
  SPRING_PROFILES_ACTIVE: "sit"
  # -- JVM 参数（沿用原 marathon.json 配置）
  JAVA_OPTS: "-XX:+UseG1GC -Xss256k -XX:G1ConcRefinementThreads=2 -XX:CICompilerCount=4 -XX:ParallelGCThreads=4"
  # -- 时区
  TZ: "Asia/Shanghai"

  # ===== Nacos 配置中心 =====
  # bootstrap.yml 写的是 nacos-headless.nacos.svc.cluster.local:8848, 本集群没有这个 Service,
  # 改用 nacos-client.nacos.svc.cluster.local:8848(同 namespace 内 ClusterIP)
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: "nacos-client.nacos.svc.cluster.local:8848"
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: "nacos-client.nacos.svc.cluster.local:8848"
  # Nacos 命名空间(msrcs bootstrap.yml 写的就是 tsp)
  SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: "tsp"
  SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: "tsp"
  # 暂不注册到 Nacos(后续要打开只需把这一行删掉)
  SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED: "false"
  # config 仍开启(从 Nacos 拉 msrcs.properties 等配置)
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "true"

# -- 来自 K8s Secret 的数据库凭据(env valueFrom.secretKeyRef 形式注入)
# 这些 Secret 由 templates/00-externalsecret.yaml 创建
dbCredentials:
  # MySQL
  - { name: MYSQL_HOST,         secretName: app-db-mysql,   secretKey: MYSQL_HOST }
  - { name: MYSQL_PORT,         secretName: app-db-mysql,   secretKey: MYSQL_PORT }
  - { name: MYSQL_DBNAME,       secretName: app-db-mysql,   secretKey: MYSQL_DBNAME }
  - { name: MYSQL_USERNAME,     secretName: app-db-mysql,   secretKey: MYSQL_USERNAME }
  - { name: MYSQL_PASSWORD,     secretName: app-db-mysql,   secretKey: MYSQL_PASSWORD }
  # MongoDB (DocumentDB, TLS 强制)
  - { name: MONGODB_HOST,       secretName: app-db-mongodb, secretKey: MONGODB_HOST }
  - { name: MONGODB_READER_HOST, secretName: app-db-mongodb, secretKey: MONGODB_READER_HOST }
  - { name: MONGODB_PORT,       secretName: app-db-mongodb, secretKey: MONGODB_PORT }
  - { name: MONGODB_USERNAME,   secretName: app-db-mongodb, secretKey: MONGODB_USERNAME }
  - { name: MONGODB_PASSWORD,   secretName: app-db-mongodb, secretKey: MONGODB_PASSWORD }
  # Redis (Valkey, TLS + AUTH)
  - { name: REDIS_HOST,         secretName: app-db-redis,   secretKey: REDIS_HOST }
  - { name: REDIS_READER_HOST,  secretName: app-db-redis,   secretKey: REDIS_READER_HOST }
  - { name: REDIS_PORT,         secretName: app-db-redis,   secretKey: REDIS_PORT }
  - { name: REDIS_AUTH_TOKEN,   secretName: app-db-redis,   secretKey: REDIS_AUTH_TOKEN }

serviceAccount:
  # -- 是否创建 ServiceAccount
  create: true
  # -- ServiceAccount annotations
  annotations: {}
  # -- 自定义名称(留空则使用默认生成)
  name: ""

# -- Service 配置: 通过 AWS Load Balancer Controller 创建 NLB
service:
  # -- LoadBalancer(NLB) / ClusterIP
  type: LoadBalancer
  # -- Service 暴露端口
  port: 80
  # -- 容器端口名(对应 deployment.yaml 中 ports.name)
  targetPortName: http
  # -- 容器端口（Spring Boot 默认 8080）
  containerPort: 8080
  # -- NLB 注解(AWS Load Balancer Controller external 模式)
  annotations:
    # -- 负载均衡类型(NLB)
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # -- IP 模式直连 Pod
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # -- 公网入口 / 内网改为 internal
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

# -- Ingress 已弃用(改用 Service type=LoadBalancer 的 NLB)
ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts: []
  tls: []

# -- 资源（原 marathon.json: cpus=0.5, mem=1536Mi）
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: 500m
    memory: 1536Mi

# -- 探针(probe)配置（路径沿用原 marathon.json 的 /admin/health）
probes:
  path: /admin/health
  liveness:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 10

# -- HPA(可选)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# -- Pod-level 注解/容忍/拓扑(可选)
podAnnotations: {}
tolerations: []
nodeSelector: {}
affinity: {}

# -- 资源配额/限额
podSecurityContext: {}
securityContext: {}
