{{- /*
  One-shot cleanup hook (v2).

  Why v2: the previous version tried to parse JSON with `python3` which is
  NOT installed in the `alpine:3.20` image — the for-loop silently produced
  no items and nothing was deleted. This version uses `wget` (which Alpine
  ships by default) and parses the JSON by hand with grep/sed so we don't
  depend on any extra package.

  After this one-shot run the legacy `nacos-debug*` resources are gone and
  this file can be removed again on a follow-up sync.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nacos.fullname" . }}-cleanup-hook
  namespace: {{ .Values.instance.namespace }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nacos.fullname" . }}-cleanup-hook
  namespace: {{ .Values.instance.namespace }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nacos.fullname" . }}-cleanup-hook
  namespace: {{ .Values.instance.namespace }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nacos.fullname" . }}-cleanup-hook
subjects:
  - kind: ServiceAccount
    name: {{ include "nacos.fullname" . }}-cleanup-hook
    namespace: {{ .Values.instance.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nacos.fullname" . }}-cleanup-hook
  namespace: {{ .Values.instance.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      name: {{ include "nacos.fullname" . }}-cleanup-hook
    spec:
      serviceAccountName: {{ include "nacos.fullname" . }}-cleanup-hook
      restartPolicy: Never
      containers:
        - name: cleanup
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              TOK=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              API="https://kubernetes.default.svc"
              # wget on Alpine supports --ca-certificate, --header, --method, --body-data
              H="Authorization: Bearer $TOK"

              list_names() {
                # $1 = path (e.g. /apis/batch/v1/namespaces/$NS/jobs)
                # extracts every "name":"<value>" pair and prints them one per line
                wget --quiet --ca-certificate="$CACERT" --header="$H" -O - \
                  "$API$1" \
                  | tr ',' '\n' \
                  | grep -oE '"name"\s*:\s*"[^"]+"' \
                  | sed 's/.*"name"\s*:\s*"\(.*\)"/\1/'
              }

              delete() {
                local code
                code=$(wget --quiet --ca-certificate="$CACERT" --header="$H" \
                  --method=DELETE -O /dev/null \
                  --server-response "$API$1" 2>&1 \
                  | grep -oE '^  HTTP/[0-9.]+ [0-9]+' \
                  | head -1 | awk '{print $2}')
                echo "    HTTP=${code:-?}"
              }

              echo "[cleanup-hook] starting cleanup in ns=$NS"
              for j in $(list_names "/apis/batch/v1/namespaces/$NS/jobs" | grep '^nacos-debug'); do
                echo "  - delete job/$j"
                delete "/apis/batch/v1/namespaces/$NS/jobs/$j"
              done
              for p in $(list_names "/api/v1/namespaces/$NS/pods" | grep '^nacos-debug'); do
                echo "  - delete pod/$p"
                delete "/api/v1/namespaces/$NS/pods/$p"
              done
              # Legacy SA / Role / RoleBinding (in case the first chart version with the
              # global ClusterRole/CRB is still around)
              for r in serviceaccount/nacos-debug role/nacos-debug rolebinding/nacos-debug; do
                echo "  - delete $r"
                delete "/api/v1/namespaces/$NS/$r" >/dev/null 2>&1 || true
                echo "    (skipped or done)"
              done
              echo "[cleanup-hook] done"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
