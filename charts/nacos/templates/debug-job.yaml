{{- /*
  One-shot debug Pod that uses a Nacos-namespace ServiceAccount bound to a
  read-only ClusterRole to introspect K8s and dump Pod/PVC/Event state for
  the Nacos instance. Triggered by ArgoCD SyncHook so its stdout is captured
  in `argocd app logs`. Disable via `debug.enabled=false` after diagnosis.
*/}}
{{- if .Values.debug.enabled | default false -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nacos.fullname" . }}-debug
  namespace: {{ .Values.instance.namespace }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nacos.fullname" . }}-debug
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, persistentvolumeclaims, events, namespaces, nodes]
    verbs: [get, list, watch, delete]
  - apiGroups: ["apps"]
    resources: [statefulsets, deployments, replicasets, daemonsets]
    verbs: [get, list, watch, delete]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses, csidrivers, csinodes]
    verbs: [get, list, watch]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch]
  - apiGroups: ["nacos.io"]
    resources: [nacos, nacos/status]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nacos.fullname" . }}-debug
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nacos.fullname" . }}-debug
subjects:
  - kind: ServiceAccount
    name: {{ include "nacos.fullname" . }}-debug
    namespace: {{ .Values.instance.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nacos.fullname" . }}-debug
  namespace: {{ .Values.instance.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      name: {{ include "nacos.fullname" . }}-debug
    spec:
      serviceAccountName: {{ include "nacos.fullname" . }}-debug
      restartPolicy: Never
      containers:
        - name: debug
          image: alpine:3.20
          env:
            - name: K8S_API
              value: https://kubernetes.default.svc
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              apk add --no-cache curl jq >/dev/null 2>&1 || true
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              echo "=========================================================="
              echo "[debug] namespace=$NS  date=$(date -u +%FT%TZ)"
              echo "=========================================================="
              echo

              curl_get() {
                local path="$1"
                curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" "$K8S_API$path"
              }
              curl_del() {
                local path="$1"
                curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -X DELETE "$K8S_API$path"
              }

              echo "========== 1. CSIDrivers (cluster-wide) =========="
              curl_get "/apis/storage.k8s.io/v1/csidrivers" | jq '[.items[] | {name, attachRequired, podInfoOnMount, storageCapacity, supportedFsTypePolicies, volumeLifecycleModes}]'
              echo

              echo "========== 2. CSINodes =========="
              curl_get "/apis/storage.k8s.io/v1/csinodes" | jq '[.items[] | {name, drivers:[.spec.drivers[] | {name, nodeID, topologyKeys, allocatable}]}]'
              echo

              echo "========== 3. Storage classes =========="
              curl_get "/apis/storage.k8s.io/v1/storageclasses" | jq '[.items[] | {name, provisioner, default:(.metadata.annotations["storageclass.kubernetes.io/is-default-class"] // "false"), reclaimPolicy, volumeBindingMode, allowVolumeExpansion, parameters, mountOptions}]'
              echo

              echo "========== 4. ebbs-csi pods cluster-wide =========="
              curl_get "/api/v1/pods?labelSelector=app.kubernetes.io%3Dname%3Debs-csi-driver" | jq '[.items[] | {name, namespace, nodeName, phase, containerStatuses:[.status.containerStatuses[]? | {name, ready, image}]}]'
              echo

              echo "========== 5. DaemonSets cluster-wide (csi related) =========="
              curl_get "/apis/apps/v1/daemonsets?labelSelector=app.kubernetes.io%2Fname%3Debs-csi-driver" | jq '[.items[] | {name, namespace, desiredNumberScheduled, numberReady, numberAvailable}]'
              echo

              echo "========== 6. PVCs (db-nacos-*) =========="
              curl_get "/api/v1/namespaces/$NS/persistentvolumeclaims" | jq '[.items[] | select(.metadata.name|startswith("db-nacos")) | {name, phase, storageClassName, requests:.spec.resources.requests, volumeName, conditions, finalizers:.metadata.finalizers}]'
              echo

              echo "========== 7. Pods (nacos-*) =========="
              for p in nacos-0 nacos-1 nacos-2; do
                echo "--- $p ---"
                curl_get "/api/v1/namespaces/$NS/pods/$p" | jq '{name, phase, podIP, nodeName, conditions:.status.conditions, containerStatuses:[.status.containerStatuses[]? | {name, ready, state, lastState}]}'
                echo
              done

              echo "========== 8. Events in $NS (latest 30) =========="
              curl_get "/api/v1/namespaces/$NS/events" | jq -r '(.items // []) | sort_by(.lastTimestamp) | reverse | .[:30] | .[] | "\(.lastTimestamp)  [\(.involvedObject.kind)/\(.involvedObject.name)]  \(.reason)  \(.message)"'
              echo

              echo "========== 9. Nodes (az + taints) =========="
              curl_get "/api/v1/nodes" | jq '[.items[] | {name:.metadata.name, zone:(.metadata.labels["topology.kubernetes.io/zone"] // "?"), instanceType:(.metadata.labels["node.kubernetes.io/instance-type"] // "?"), unschedulable:.spec.unschedulable, taints:.spec.taints}]'
              echo

              echo "=========================================================="
              echo "[debug] done"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end -}}
