{{- if .Values.operator.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nacos.operator.serviceAccountName" . }}
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-operator
{{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nacos.operator.fullname" . }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-operator
rules:
  - apiGroups: [nacos.io]
    resources: [nacos]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [nacos.io]
    resources: [nacos/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nacos.operator.fullname" . }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nacos.operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nacos.operator.serviceAccountName" . }}
    namespace: {{ .Values.operator.namespace }}
{{- end }}
