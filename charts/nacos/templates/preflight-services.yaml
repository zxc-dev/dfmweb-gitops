apiVersion: v1
kind: Service
metadata:
  name: nacos-client
  namespace: {{ .Values.instance.namespace }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
    app: {{ .Values.instance.name }}
    middleware: nacos
    component: nacos
  # The nacos-operator v1.0.2 controller hard-codes a dual-stack (IPv4+IPv6)
  # `nacos-client` Service which is rejected by IPv4-only clusters such as
  # EKS (default). Because its reconciler uses `CreateIfNotExistsService`
  # for the client Service, we pre-create an IPv4-only Service with the
  # same name so the controller skips the bad update and proceeds to
  # reconcile StatefulSet / Pods. The selector / ports mirror what the
  # operator would otherwise produce.
  annotations:
    argocd.argoproj.io/ignore-resource-updates: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  type: ClusterIP
  ports:
    - name: client
      port: 8848
      protocol: TCP
    - name: rpc
      port: 9848
      protocol: TCP
  selector:
    app: {{ .Values.instance.name }}
    middleware: nacos
    component: nacos
