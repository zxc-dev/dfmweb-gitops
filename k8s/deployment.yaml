apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfmweb
  namespace: dfmweb
  labels:
    app.kubernetes.io/name: dfmweb
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dfmweb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dfmweb
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: nginx
          image: REPLACE_REGISTRY/dfmweb:latest  # TODO: 替换为实际镜像仓库地址
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TREV
              value: "dev"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: dfmweb-nginx-config